<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Flipkart clone homepage setup">
    <meta name="keywords" content="flipkart, ecommerce, shopping">
    <meta name="author" content="Abhinav chaubey">
    <title>Flipkart Clone</title>
    

    <!-- css link -->
     <link rel="icon" href="../asset/flipkart-fevicon-icon.jpg" type="image/jpg" sizes="32x32">
     <link rel="stylesheet" href="../css/home.css">

     <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- google icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="topbar">
            <div class="brand-wrap">
                <div class="logo-box">
                    <img src="../asset/flipkart-logo-header.svg" alt="Flipkart logo">
                </div>
                <div class="explore-box">
                    <span>Explore</span>
                    <span class="plus">Plus</span>
                </div>
            </div>

            <div class="search-wrap">
                <input type="text" class="search-input" placeholder="Search for Products, Brands and More" aria-label="Search products">
                <button class="search-button" type="button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <div class="header-actions">
                <button class="login-btn" type="button">Login</button>
                <a href="#" class="nav-link">Become a Seller</a>
                <a href="#" class="nav-link">More</a>
                <a href="#" class="nav-link cart-link"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
            </div>
        </div>

        <nav class="category-bar" aria-label="Main categories">
            <div class="category-item">
                <img src="../asset/flipkart-minutes-logo.svg" alt="Flipkart Minutes">
                <span>Minutes</span>
            </div>
            <div class="category-item">
                <img src="../asset/flight-icon.svg" alt="Travel">
                <span>Travel</span>
            </div>
            <div class="category-item">
                <img src="../asset/grocery-basket.svg" alt="Grocery">
                <span>Grocery</span>
            </div>
            <div class="category-item">
                <img src="../asset/flipkart-logo-header.svg" alt="Electronics">
                <span>Electronics</span>
            </div>
            <div class="category-item">
                <img src="../asset/flipkart-logo-header.svg" alt="Fashion">
                <span>Fashion</span>
            </div>
            <div class="category-item">
                <img src="../asset/flipkart-logo-header.svg" alt="Home">
                <span>Home</span>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <section class="hero-banner">
            <div class="hero-card">
                <h1>Big saving days are here</h1>
                <p>Fresh deals, trending essentials, and top brands curated for you.</p>
                <button type="button">Shop Now</button>
            </div>
        </section>

        <section class="product-strip" aria-label="Featured products">
            <article class="product-card">
                <div class="thumb thumb-one"></div>
                <h3>Smartphones</h3>
                <p>From ₹8,999</p>
            </article>
            <article class="product-card">
                <div class="thumb thumb-two"></div>
                <h3>Laptops</h3>
                <p>Up to 50% off</p>
            </article>
            <article class="product-card">
                <div class="thumb thumb-three"></div>
                <h3>Appliances</h3>
                <p>Best deals</p>
            </article>
            <article class="product-card">
                <div class="thumb thumb-four"></div>
                <h3>Fashion</h3>
                <p>Explore now</p>
            </article>
        </section>
    </main>

    <script src="../script/app.js"></script>
</body>
</html>
