<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Simple Form Layout</title>
	<style>
		:root {
			--bg: #f1f5f9;
			--card: #ffffff;
			--text: #1e293b;
			--muted: #64748b;
			--primary: #0f766e;
			--primary-hover: #115e59;
			--border: #dbe3ee;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(150deg, #eff6ff, var(--bg));
			color: var(--text);
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 1.2rem;
		}

		.form-container {
			width: min(760px, 100%);
			background: var(--card);
			border: 1px solid var(--border);
			border-radius: 14px;
			box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
			overflow: hidden;
		}

		.form-header {
			background: #0f172a;
			color: #f8fafc;
			padding: 1.1rem 1.3rem;
		}

		.form-header h1 {
			font-size: 1.4rem;
			margin-bottom: 0.3rem;
		}

		.form-header p {
			font-size: 0.95rem;
			color: #cbd5e1;
		}

		form {
			padding: 1.25rem;
		}

		.grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 1rem;
		}

		.field {
			display: flex;
			flex-direction: column;
			gap: 0.38rem;
		}

		.full {
			grid-column: 1 / -1;
		}

		label {
			font-weight: 600;
			font-size: 0.92rem;
		}

		input,
		select,
		textarea {
			width: 100%;
			border: 1px solid var(--border);
			border-radius: 9px;
			padding: 0.66rem 0.72rem;
			font: inherit;
			color: var(--text);
			background: #fff;
		}

		input:focus,
		select:focus,
		textarea:focus {
			outline: 2px solid #99f6e4;
			border-color: var(--primary);
		}

		textarea {
			min-height: 115px;
			resize: vertical;
		}

		.hint {
			color: var(--muted);
			font-size: 0.85rem;
		}

		.actions {
			margin-top: 1.1rem;
			display: flex;
			gap: 0.7rem;
			justify-content: flex-end;
			flex-wrap: wrap;
		}

		button {
			border: none;
			border-radius: 9px;
			padding: 0.62rem 1.05rem;
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}

		.submit-btn {
			background: var(--primary);
			color: #fff;
		}

		.submit-btn:hover {
			background: var(--primary-hover);
		}

		.reset-btn {
			background: #e2e8f0;
			color: #0f172a;
		}

		.reset-btn:hover {
			background: #cbd5e1;
		}

		@media (max-width: 680px) {
			.grid {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<section class="form-container">
		<header class="form-header">
			<h1>Contact Form</h1>
			<p>Simple form layout practice using HTML and CSS grid.</p>
		</header>

		<form action="#" method="post">
			<div class="grid">
				<div class="field">
					<label for="firstName">First Name</label>
					<input type="text" id="firstName" name="firstName" placeholder="Enter first name" required>
				</div>

				<div class="field">
					<label for="lastName">Last Name</label>
					<input type="text" id="lastName" name="lastName" placeholder="Enter last name" required>
				</div>

				<div class="field">
					<label for="email">Email</label>
					<input type="email" id="email" name="email" placeholder="you@example.com" required>
				</div>

				<div class="field">
					<label for="phone">Phone</label>
					<input type="tel" id="phone" name="phone" placeholder="9876543210">
				</div>

				<div class="field full">
					<label for="topic">Topic</label>
					<select id="topic" name="topic" required>
						<option value="" selected disabled>Select a topic</option>
						<option value="support">Support</option>
						<option value="feedback">Feedback</option>
						<option value="collaboration">Collaboration</option>
					</select>
				</div>

				<div class="field full">
					<label for="message">Message</label>
					<textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
					<p class="hint">Keep your message short and clear.</p>
				</div>
			</div>

			<div class="actions">
				<button type="reset" class="reset-btn">Reset</button>
				<button type="submit" class="submit-btn">Submit</button>
			</div>
		</form>
	</section>
</body>
</html>
