<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .dashboard-container{
            width: 100%;
            height: 100vw;
            background-color: rgb(115, 177, 115);
            display: grid;
            gap: 5px;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 100px 1fr 1fr 1fr;
            text-align: center;
/* 
            grid-template-columns: 
            [sidebar-start]1fr 
            [sidebar-end header-start]1fr 1fr
            [header-end sidebar-start] 1fr
            [sidebar-end];

            grid-template-rows: 
            [sidebar-start header-start sidetop-start]1fr
            1fr[header-end sidetop-end]
            [card1-start card2-start]  1fr [card1-end card2-end card3-start card4-start panel-start] 
            1fr[card3-end card4-end panel-end]
            [sidebar-end footer-start] 1fr[footer-end]; */

        }
         .sidebar{
            background-color: rgb(26, 94, 140);
            grid-column: 1 / 2;
            grid-row: 1/ span 4;
        }
        .header{
            background-color: rgb(123, 98, 49);
            grid-column: 2/ span 2;

        }
        .side-top{
            background-color: aqua;


        }
        .card-1{
            background-color: yellow;
            
        }
        .card-1{
            
            background-color: green;
        }
        .card-2{
            background-color: bisque;
            
        }
        .card-3{
            background-color: azure;
            
        }
        .card-4{
            background-color: blueviolet;
            
        }
        .panel{
            background-color: hotpink;
            grid-column: 4/-1;
            grid-row: 2/ span 2;

        }
        .footer{
            background-color: rgb(155, 118, 190);
            grid-column: 1/ -1;
            grid-row: 4/-1;
            text-align: center;
            
        }
        
    </style>
</head>
<body>

    <main class="dashboard-container">

        <section class="sidebar">
            <h1>Sidebar</h1>
        </section>

        <section class="header">
            <h1>Header</h1>
        </section>

        <div class="side-top">
            <h1>side top</h1>
        </div>

        <div class="card-1">card 1</div>
        <div class="card-2">card 2</div>
        <div class="card-3">card 3</div>
        <div class="card-4">card 4</div>

        <div class="panel">Panel</div>

        <section class="footer">
            <h1>this is footer</h1>
        </section>
    </main>
    
</body>
</html>
