<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .grid-container{

            display: grid;
            width: 100%;
            height: 100vh;
            /* background-color: rgb(114, 61, 61); */
            grid-template-columns: 1fr 4fr;
            grid-template-rows: 100px  3fr 1fr;
            grid-template-areas: 
                                'sidebar header-section'
                                'sidebar main-section'
                                'footer-section footer-section';
            gap: 10px;
            
        }
        .item1{
            background-color: aqua;
            grid-area: sidebar;


        }
        .item2{
            background-color: green;
            grid-area: header-section;

        }
        .item3{
            background-color: yellow;
            grid-area: main-section;

        }
        .item4{
            background-color: beige;
            grid-area: footer-section;

        }
        
    


    </style>
</head>
<body>

    <div class="grid-container">

        <div class="grid-item item1">item</div>
        <div class="grid-item item2">item</div>
        <div class="grid-item item3"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_KQS6mIxs_7HhJl--CRGzBYQkY4__GyqJQhPv2ZOzDQ&s" alt="" width="100%" height="100%"></div>
        <div class="grid-item item4">item</div>
        <!-- <div class="grid-item item5">item</div> -->
        <!-- <div class="grid-item item6">item</div> -->
    </div>
    


</body>
</html>
