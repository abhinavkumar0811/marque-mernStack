    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>project 1</title>

        <style>

            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html{
                font-family: Arial, Helvetica, sans-serif;
            }
            body{
                color: aliceblue;
                color: black;
            }
            .item-container{
                width: 290px;
                height: auto;
                background-color: rgb(214, 211, 207);
                border: 4px solid rgb(199, 130, 116);
                margin: 50px auto;
                border-radius: 3px;
                position: relative;
                overflow: hidden;
            }
            .i{
                padding: 8px;
            }
            .item-img img{
                width: 100%;
                /* border-radius: 10px; */
            }
            .item-description{
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .purchase-detail{
                display: flex;
                flex-direction: row;
                justify-content: space-between;

            }
            .badge{
                /* border: 2px solid black; */
                display: inline-block;
                padding: 4px;
                background-color: rgb(182, 87, 87);
                color: white;
                border-radius: 2px;
                position: absolute;
                top: 5px;
                right: 5px;
            }
            .purchase-detail >*:last-child{
                background-color: rgb(63, 63, 159);
                padding: 8px;
                border-radius: 4px;
                color: white;
                border: none;
            }



        </style>
    </head>
    <body>
        
        <!-- <img src="https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcT-qIPpjmIkXDR2-h6v6SJbbRds-9mX60Ehm9YrWFLJMaQK7MQh" alt=""> -->

        <article class="item-container">

            <div class="item-img">
                <img src="https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcT-qIPpjmIkXDR2-h6v6SJbbRds-9mX60Ehm9YrWFLJMaQK7MQh" alt="">
            </div>

            <div class="item-description i">

                <i class="badge">SALE</i>
                <p class="product-title">Titan</p>
                <p class="description">Lorem ipsum dolor sit amet consecter adipisicing elit.e atis magni. Conseqr, dolor laborum?</p>
            </div>

            <div class="purchase-detail i">

                <p class="price"><strong>$19.99</strong></p>
                <button>Buy now</button>

            </div>


        </article>

    </body>
    </html>
