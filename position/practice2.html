    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>project 1</title>

        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body{
                background-color: rgb(230, 230, 235);
            }
            .portfolio-container{
                margin: 40px auto;
                width: 500px;
                height: auto;
                border: 2px solid black;
                background-color: white;
                border-radius: 20px;
                overflow: hidden;
                padding: 10px;
                position: relative;

            }
             .badge{
                position: absolute;
                font-size: 50px;
                top: 10px;
                background-color: white;
                right: 10px;
                border-radius: 100%;
                z-index: 100;
                padding: 10px;

            }
            .container-img{
                width: 100%;
                height: auto;


            }
            .background-img img{
                width: 100%;
                border-radius: 20px;
            }
            .profile-img{
                position: relative;
                background-color: red;
                border-radius: 100%;
                overflow: hidden;

            }
           .profile-img img{ 
               width: 140px;
           }
            .personal-info{

            }
            .card-footer{

            }
         
        </style>
    </head>
    <body>
        

        <!-- portfolio card section -->

        <article class="portfolio-container">

            <div class="container-img">

                <span class="badge">+</span>
            
                <!-- background image -->
                <div class="background-img">
                    <img src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcQnjxA4-KTk5S13Ivo74FzwET34XisVjv2aRUdGX9XfgSv1xk22"
                     alt="backgroun image">
                </div>

                <!-- profile image -->

                 <div class="profile-img">
                    <img src="https://static.vecteezy.com/system/resources/thumbnails/050/907/528/small/3d-rendered-cartoon-boy-wearing-a-blue-hoodie-png.png" 
                    alt="profile image">
                 </div>

            </div>

          


            <!-- about section -->

            <div class="personal-info">
                <p class="name">Avex jesson</p>
                <p class="bio">create web design how focusing on aesthetic and simplicity</p>
            </div>

            <!-- social medical info -->
             <div class="social-media">

                <div class="like">
                    <p class="like-count">77.7K</p>
                    <p class="title">Likes</p>
                </div>

                <div class="post">
                    <p class="post-count">727</p>
                    <p class="title">Posts</p>
                </div>

                <div class="view">
                    <p class="view-detail">277.2K</p>
                    <p class="title">Views</p>  
                </div>
             </div>

             <!-- portfolio card footer -->
              <div class="card-footer">
                <div class="social-media"></div>
                <div class="social-media"></div>
                <div class="social-media"></div>
              </div>

        </article>
    
    </body>
    </html>
