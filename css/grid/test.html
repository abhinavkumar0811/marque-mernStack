<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f6f5f3;
            font-family: Arial, sans-serif;
        }

        .grid-container {
            display: grid;
            width: 680px;
            max-width: 100%;
            grid-template-columns: 1fr 1.5fr 1.5fr;
            grid-template-rows: 80px 1fr 120px;
            gap: 16px;
            padding: 16px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.1);
        }

        .grid-item {
            border-radius: 18px;
            padding: 18px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .header {
            grid-column: 1 / -1;
            background: #ff9f43;
        }

        .sidebar {
            grid-row: 2 / 3;
            background: #ff6b6b;
        }

        .content-1 {
            /* grid-column: 1/1; */
            background: #54a0ff;
        }

        .content-2 {
            background: #5f27cd;
        }

        .content-3 {
            grid-column: 1/4;
            background: #10ac84;
        }

        .footer {
            grid-column: 1 / -1;
            background: #576574;
            padding: 50px;
        }

        .content-2,
        .content-3 {
            min-height: 100px;
            color: #fff;
        }

        .sidebar {
            min-height: 240px;
            align-items: flex-start;
            padding-top: 24px;
        }

        .footer {
            align-items: center;
        }
    </style>
</head>
<body>
    

    <div class="grid-container">
        <div class="grid-item header">Header</div>
        <div class="grid-item sidebar">Sidebar</div>
        <div class="grid-item content-1">Content 1</div>
        <div class="grid-item content-2">Content 2</div>
        <div class="grid-item content-3">Content 3</div>
        <div class="grid-item footer">Footer</div>
    </div>
</body>
</html>
